name: Masaüstü Uygulamasını Derle ve Yayınla

# Her gönderimde testler çalışır, uygulama derlenir ve yeni sürüm GitHub Releases'a
# yayınlanır. Kurulu uygulamalar bu sürümü otomatik olarak bulup kendini günceller.
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_VERSION: 1.1.${{ github.run_number }}

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  windows:
    name: Windows (.exe) derle ve yayınla
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sürüm numarasını ayarla
        shell: bash
        run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - name: Derle ve GitHub Releases'a yayınla
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Ayra-Design-Windows
          path: dist/*.exe
          retention-days: 30

  linux:
    name: Linux (AppImage) derle ve yayınla
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --linux AppImage --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
