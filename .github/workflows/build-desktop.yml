name: Masaüstü Uygulamasını Derle ve Yayınla

# Her gönderimde testler çalışır, uygulama derlenir ve yeni sürüm GitHub Releases'a
# yayınlanır. Kurulu uygulamalar bu sürümü otomatik olarak bulup kendini günceller.
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_VERSION: 1.1.${{ github.run_number }}

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  windows:
    name: Windows (.exe) derle ve yayınla
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sürüm numarasını ayarla
        shell: bash
        run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - name: Derle ve GitHub Releases'a yayınla
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Ayra-Design-Windows
          path: dist/*.exe
          retention-days: 30

  linux:
    name: Linux (AppImage) derle ve yayınla
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --linux AppImage --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android (.apk) derle ve yayınla
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor projesini hazırla
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Simge, açılış ekranı ve renkler
        run: |
          pip install --quiet pillow
          python3 mobile/android-assets.py mobile/android
      - name: Sürüm numarasını ayarla
        working-directory: mobile/android
        run: |
          CODE=$(( ${{ github.run_number }} + 100 ))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" app/build.gradle
      - name: APK derle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Ayra-Design-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ayra-Design-Android
          path: Ayra-Design-Android.apk
          retention-days: 30
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$APP_VERSION" Ayra-Design-Android.apk --clobber
