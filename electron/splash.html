<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'" />
  <title>Ayra Design</title>
  <style>
    @font-face { font-family: 'Poppins'; font-weight: 400; src: url(../public/fonts/poppins-latin-400-normal.woff2) format('woff2'); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Poppins, system-ui, sans-serif; user-select: none; }
    :root { --w: 600px; --h: 400px; --r: 30px; }
    /* yüzen kartın gölgesi (kart büyürken kaybolur) */
    .halo { position: fixed; left: 50%; top: 50%; width: var(--w); height: var(--h); margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2); border-radius: var(--r);
      box-shadow: 0 30px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(155,135,245,.25), 0 0 60px rgba(155,135,245,.18);
      opacity: 0; transform: scale(.92); animation: cardIn .7s cubic-bezier(.2,.9,.2,1) .05s forwards; transition: opacity .35s; }
    /* kartın kendisi: tam ekran bir katman, clip-path ile yuvarlak köşeli küçük kart olarak kesilir */
    .card { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 42%, #2a1f5c 0%, #15122b 38%, #0b0c10 70%);
      clip-path: inset(calc(50% - var(--h) / 2) calc(50% - var(--w) / 2) round var(--r));
      opacity: 0; animation: fadeIn .6s ease .05s forwards; }
    .card.expand { transition: clip-path .85s cubic-bezier(.76,0,.24,1); clip-path: inset(0 0 0 0 round 0); }
    .halo.expand { opacity: 0; transition: opacity .25s; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; transition: transform .85s cubic-bezier(.76,0,.24,1); }
    .card.expand .center { transform: translate(-50%, -50%) scale(1.15); }
    .mark { width: 120px; aspect-ratio: 549 / 622; margin: 0 auto; background: linear-gradient(135deg, #c3b5ff, #9b87f5 45%, #20c997); background-size: 200% 200%;
      -webkit-mask: url(../public/img/mark.png) center / contain no-repeat; filter: drop-shadow(0 0 26px rgba(155,135,245,.6));
      clip-path: polygon(0 100%, 0 100%, 0 100%); animation: reveal 1.2s cubic-bezier(.7,0,.2,1) .35s forwards, shift 4s linear 1.6s infinite; }
    .word { width: 280px; aspect-ratio: 1001 / 338; margin: 20px auto 0; background: linear-gradient(90deg, #fff, #c3b5ff, #9b87f5, #20c997, #fff); background-size: 300% 100%;
      -webkit-mask: url(../public/img/wordmark.png) center / contain no-repeat; clip-path: inset(0 100% 0 0); animation: write 1s cubic-bezier(.7,0,.2,1) 1.25s forwards, shine 4s linear 2.3s infinite; }
    .tag { color: #8a8fa3; letter-spacing: 6px; text-transform: uppercase; font-size: 11px; margin-top: 12px; opacity: 0; animation: up .7s ease 2s forwards; }
    .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); margin: 18px auto 0; overflow: hidden; opacity: 0; animation: up .4s 2.1s forwards; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #9b87f5, #20c997); animation: load 1s cubic-bezier(.4,0,.2,1) 2.15s forwards; }
    @keyframes cardIn { to { opacity: 1; transform: none; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes reveal { 0% { clip-path: polygon(0 100%, 0 100%, 0 100%); transform: scale(.75) rotate(-10deg); } 100% { clip-path: polygon(0 100%, 0 -200%, 300% 100%); transform: none; } }
    @keyframes shift { 50% { background-position: 100% 100%; } }
    @keyframes write { to { clip-path: inset(0 0 0 0); } }
    @keyframes shine { to { background-position: 300% 0; } }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes load { to { width: 100%; } }
  </style>
</head>
<body>
  <div class="halo" id="halo"></div>
  <div class="card" id="card">
    <canvas id="c"></canvas>
    <div class="center">
      <div class="mark"></div>
      <div class="word"></div>
      <div class="tag">Oyun Tasarım Stüdyosu</div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <script>
    // logonun etrafında dönen parçacıklar
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    let w, h; const dpr = Math.min(devicePixelRatio || 1, 2);
    const size = () => { w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); addEventListener('resize', size);
    const cols = ['#9b87f5', '#c3b5ff', '#20c997', '#f06595', '#4dabf7'];
    const ps = Array.from({ length: 90 }, (_, i) => { const a = Math.random() * Math.PI * 2; return { a, r: 110 + Math.random() * 150, s: (Math.random() * .5 + .2) * (Math.random() < .5 ? -1 : 1), sz: Math.random() * 1.8 + .6, c: cols[i % 5], x: w / 2 + Math.cos(a) * 700, y: h / 2 + Math.sin(a) * 500 }; });
    const t0 = performance.now();
    (function frame(now) {
      const t = (now - t0) / 1000, k = Math.min(1, t / 1.8), e = 1 - Math.pow(1 - k, 3);
      ctx.clearRect(0, 0, w, h);
      for (const p of ps) {
        p.a += p.s * .01;
        const tx = w / 2 + Math.cos(p.a) * p.r, ty = h / 2 - 20 + Math.sin(p.a) * p.r * .55;
        p.x += (tx - p.x) * (.02 + e * .08); p.y += (ty - p.y) * (.02 + e * .08);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fillStyle = p.c; ctx.shadowBlur = 8; ctx.shadowColor = p.c; ctx.fill();
      }
      ctx.shadowBlur = 0;
      for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
        const a = ps[i], b = ps[j], d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
        if (d < 5000) { ctx.strokeStyle = `rgba(155,135,245,${.16 * (1 - d / 5000)})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      requestAnimationFrame(frame);
    })(t0);

    // logo belirdikten sonra kart büyüyerek ekranı kaplar
    const card = document.getElementById('card'), halo = document.getElementById('halo');
    let expanded = false;
    function expand() {
      if (expanded) return; expanded = true;
      halo.classList.add('expand');
      card.classList.add('expand');
      setTimeout(() => window.splash && window.splash.done(), 900);
    }
    setTimeout(expand, 3300);
    addEventListener('keydown', (e) => { if (['Escape', 'Enter', ' '].includes(e.key)) expand(); });
    addEventListener('click', expand);
  </script>
</body>
</html>
