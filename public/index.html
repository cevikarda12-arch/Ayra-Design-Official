<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayra Design · Oyun Tasarım Stüdyosu</title>
  <meta name="description" content="Ayra Design - oyun tasarım ekipleri için hepsi bir arada stüdyo uygulaması" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/modules.css" />
</head>
<body>
  <!-- Açılış animasyonu -->
  <div id="intro" class="intro" aria-hidden="true">
    <canvas id="introCanvas"></canvas>
    <div class="intro-center">
      <svg class="intro-logo" viewBox="0 0 120 120" width="140" height="140">
        <defs>
          <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c3b5ff" />
            <stop offset=".5" stop-color="#9b87f5" />
            <stop offset="1" stop-color="#20c997" />
          </linearGradient>
        </defs>
        <polygon class="il-hex" points="60,6 107,33 107,87 60,114 13,87 13,33" fill="none" stroke="url(#ig)" stroke-width="3" />
        <path class="il-a" d="M36 88 L60 30 L84 88" fill="none" stroke="url(#ig)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        <path class="il-bar" d="M45 68 L75 68" fill="none" stroke="url(#ig)" stroke-width="7" stroke-linecap="round" />
        <circle class="il-dot" cx="60" cy="30" r="5" fill="#fff" />
      </svg>
      <h1 class="intro-title"><span>A</span><span>Y</span><span>R</span><span>A</span></h1>
      <div class="intro-sub">design</div>
      <div class="intro-tag">Oyun Tasarım Stüdyosu</div>
      <div class="intro-bar"><i></i></div>
    </div>
    <button class="intro-skip" id="introSkip">Geç ›</button>
  </div>

  <!-- Giriş / kayıt ekranı -->
  <div id="auth" class="auth hidden"></div>

  <!-- Ana uygulama -->
  <div id="app" class="app hidden"></div>

  <div id="toasts" class="toasts"></div>
  <div id="modalRoot"></div>

  <script src="vendor/lucide.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/core.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/projects.js"></script>
  <script src="js/modules/tasks.js"></script>
  <script src="js/modules/notes.js"></script>
  <script src="js/modules/draw.js"></script>
  <script src="js/modules/chat.js"></script>
  <script src="js/modules/gdd.js"></script>
  <script src="js/modules/entities.js"></script>
  <script src="js/modules/levels.js"></script>
  <script src="js/modules/dialogues.js"></script>
  <script src="js/modules/pixel.js"></script>
  <script src="js/modules/bugs.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/ideas.js"></script>
  <script src="js/modules/files.js"></script>
  <script src="js/modules/tools.js"></script>
  <script src="js/modules/wiki.js"></script>
  <script src="js/modules/playtests.js"></script>
  <script src="js/modules/team.js"></script>
  <script src="js/modules/profile.js"></script>
  <script src="js/modules/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
